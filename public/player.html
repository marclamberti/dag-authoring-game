<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DAG Builder: Join</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="player">
    <div class="brand">DAG BUILDER</div>

    <!-- Join screen -->
    <div class="center" id="join-screen">
      <div class="p-title">Join the build</div>
      <div class="p-prompt">Pick a name, you'll vote on every line of the DAG.</div>
      <div class="field">
        <input id="name" placeholder="Your name" maxlength="24" autocomplete="off" />
        <button class="p-opt" id="join-btn" style="text-align:center">Let's go</button>
      </div>
    </div>

    <!-- Lobby / waiting -->
    <div class="center hidden" id="wait-screen">
      <div class="p-title" id="wait-title">You're in!</div>
      <div class="p-prompt" id="wait-sub">Waiting for the host to start…</div>
      <div class="score-tag hidden" id="wait-score"></div>
    </div>

    <!-- Level 3 lab: your own Airflow + a task checklist -->
    <div class="center hidden" id="lab-screen">
      <div class="p-title" id="lab-title"></div>
      <div class="p-prompt" id="lab-prompt"></div>
      <div class="lab-sandbox" id="lab-sandbox"></div>
      <ul class="lab-tasks" id="lab-tasks"></ul>
      <div class="score-tag" id="lab-score"></div>
    </div>

    <!-- Voting -->
    <div class="center hidden" id="vote-screen">
      <div class="p-title" id="p-title"></div>
      <div class="p-prompt" id="p-prompt"></div>
      <div class="p-timer hidden" id="p-timer"><span id="p-timer-num"></span> s left</div>
      <div class="p-options" id="p-options"></div>
      <div class="pill hidden" id="p-status"></div>
      <div class="score-tag" id="p-score"></div>
    </div>
  </div>

  <!-- Confetti overlay: your personal reward for getting the answer right -->
  <canvas class="confetti-canvas" id="confetti" aria-hidden="true"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/player.js"></script>
</body>
</html>
