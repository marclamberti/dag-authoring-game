# A whole DAG composed from the ExtractLoad blueprint — no Python needed here.
# The ~25 lines a hand-written DAG would take collapse into a few validated keys.
dag_id: sales_pipeline
schedule: "@daily"
description: "Sales extract -> load, composed from a Blueprint"

steps:
  extract_sales:
    blueprint: extract_load
    source: postgres
    table: sales
    rows: 5000

  extract_regions:
    blueprint: extract_load
    source: postgres
    table: regions
    rows: 200

  report:
    blueprint: extract_load
    depends_on: [extract_sales, extract_regions]
    source: warehouse
    table: sales_report
    rows: 5000
