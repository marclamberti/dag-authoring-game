# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
#
# This is a stateful Socket.IO server with the game state in memory, so it must
# run as ONE instance (no autoscaling) on a persistent web service (not serverless).
services:
  - type: web
    name: dag-authoring-game
    runtime: node
    plan: free # free sleeps after ~15 min idle (cold start ~30s); bump to "starter" to keep warm
    numInstances: 1 # keep at 1: one shared in-memory game session
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true # redeploy on push to the default branch
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Level 3 (optional): per-participant Airflow sandboxes via Modal. Leave
      # unset to disable Level 3 cleanly. Deploy modal/airflow_sandbox.py, then
      # fill these in the Render dashboard (Environment tab). See modal/README.md.
      - key: MODAL_SANDBOX_START_URL
        sync: false
      - key: MODAL_SANDBOX_STOP_URL
        sync: false
      - key: MODAL_SANDBOX_HEALTH_URL
        sync: false
      - key: MODAL_SANDBOX_TOKEN
        sync: false
      - key: MAX_SANDBOXES
        value: "60"
